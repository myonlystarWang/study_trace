[project]
name = "study-trace"
version = "0.1.0"
description = "Junior 1 Student Homework Check-in & Mistake Notebook System"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "pillow>=11.0.0",
    "bcrypt>=4.2.0",
    "rapidocr-onnxruntime>=1.3.24",
    "apscheduler>=3.10.4",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
